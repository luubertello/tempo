services:
  db:
    image: postgres:16-alpine
    container_name: entrenamiento-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: .
      target: dev
    container_name: entrenamiento-api
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  pgdata: